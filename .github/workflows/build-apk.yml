name: Build Real Local habitOS Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Files
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Bundle HTML, Icons & Offline Libraries
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            FIRST_HTML=$(find . -maxdepth 1 -iname "*.html" | head -n 1)
            cp "$FIRST_HTML" www/index.html
          fi
          if [ -f "manifest.json" ]; then cp manifest.json www/; fi
          if [ -f "icon.png" ]; then cp icon.png www/; fi
          curl -sL https://cdn.tailwindcss.com -o www/tailwind.js || true
          curl -sL https://unpkg.com/lucide@latest -o www/lucide.js || true
          if [ -s www/tailwind.js ]; then sed -i 's|https://cdn.tailwindcss.com|./tailwind.js|g' www/index.html; fi
          if [ -s www/lucide.js ]; then sed -i 's|https://unpkg.com/lucide@latest|./lucide.js|g' www/index.html; fi

      - name: 5. Initialize Native Capacitor Android Project
        run: |
          cat << 'EOF' > package.json
          {
            "name": "habitos-local-app",
            "version": "1.0.0",
            "description": "habitOS Local Android App",
            "private": true
          }
          EOF
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "habitOS" "com.enzatech.habitos" --web-dir www
          npx cap add android
          npx cap copy android

      - name: 6. Apply Custom icon.png to Android Launcher
        run: |
          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick || true
            convert icon.png -resize 48x48 PNG32:android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
            convert icon.png -resize 48x48 PNG32:android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png || true
            convert icon.png -resize 108x108 PNG32:android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png || true
            convert icon.png -resize 72x72 PNG32:android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
            convert icon.png -resize 72x72 PNG32:android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png || true
            convert icon.png -resize 162x162 PNG32:android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png || true
            convert icon.png -resize 96x96 PNG32:android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
            convert icon.png -resize 96x96 PNG32:android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png || true
            convert icon.png -resize 216x216 PNG32:android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png || true
            convert icon.png -resize 144x144 PNG32:android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
            convert icon.png -resize 144x144 PNG32:android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png || true
            convert icon.png -resize 324x324 PNG32:android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png || true
            convert icon.png -resize 192x192 PNG32:android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
            convert icon.png -resize 192x192 PNG32:android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true
            convert icon.png -resize 432x432 PNG32:android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png || true
          fi

      - name: 7. Compile Standalone Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: habitOS-Local-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
