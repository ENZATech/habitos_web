name: Build Real Local habitOS Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Files
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Set up Java 17 for Android Gradle Compiler
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Bundle HTML, Icons & Offline Libraries Inside App
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f "manifest.json" ]; then cp manifest.json www/; fi
          if [ -f "icon.png" ]; then cp icon.png www/; fi
          # Download Tailwind & Lucide directly into the APK so it works 100% offline
          curl -sL https://cdn.tailwindcss.com -o www/tailwind.js
          curl -sL https://unpkg.com/lucide@latest -o www/lucide.js
          sed -i 's|https://cdn.tailwindcss.com|./tailwind.js|g' www/index.html
          sed -i 's|https://unpkg.com/lucide@latest|./lucide.js|g' www/index.html

      - name: 6. Build Native Android Project with Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "habitOS" "com.enzatech.habitos" --web-dir www
          npx cap add android
          npx cap copy android

      - name: 7. Apply Your Custom icon.png to Native Android Launcher Icons
        run: |
          if [ -f "icon.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            convert icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
            convert icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            convert icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
            convert icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            convert icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
            convert icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            convert icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
            convert icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            convert icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          fi

      - name: 8. Compile Standalone Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: habitOS-Local-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
